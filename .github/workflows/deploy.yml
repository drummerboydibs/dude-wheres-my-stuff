name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site into dist/ (runtime files + generated config.js)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi
          mkdir -p dist
          # Publish only what the browser actually needs. This keeps
          # node_modules/, tests/, supabase/, mockups/ and docs out of the
          # deployed site (smaller artifact, smaller public surface).
          cp index.html styles.css app.js db.js utils.js site.webmanifest \
             favicon.ico favicon-16x16.png favicon-32x32.png \
             android-chrome-192x192.png android-chrome-512x512.png \
             apple-touch-icon.png dist/
          # config.js is generated from secrets. The anon key is public by
          # design (protected by RLS), so baking it into the site is fine.
          node -e "const fs=require('fs');fs.writeFileSync('dist/config.js','window.LOAN_LIST_SUPABASE_URL='+JSON.stringify(process.env.SUPABASE_URL)+';\nwindow.LOAN_LIST_SUPABASE_KEY='+JSON.stringify(process.env.SUPABASE_ANON_KEY)+';\n');"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
